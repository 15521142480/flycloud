x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: "${STOP_GRACE_PERIOD:-30s}"
  security_opt:
    - "no-new-privileges:true"
  logging: *default-logging

services:
  flycloud-gateway:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-gateway"
      dockerfile: Dockerfile
    image: "flycloud-gateway:${IMAGE_TAG:-latest}"
    container_name: flycloud-gateway
    ports:
      - "8080:8080"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-gateway/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_GATEWAY_JAVA_OPTS:-}"

  flycloud-auth:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-auth"
      dockerfile: Dockerfile
    image: "flycloud-auth:${IMAGE_TAG:-latest}"
    container_name: flycloud-auth
    ports:
      - "8088:8088"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-auth/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_AUTH_JAVA_OPTS:-}"

  flycloud-system:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-system"
      dockerfile: Dockerfile
    image: "flycloud-system:${IMAGE_TAG:-latest}"
    container_name: flycloud-system
    ports:
      - "8085:8085"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-system/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_SYSTEM_JAVA_OPTS:-}"

  flycloud-bpm:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-bpm"
      dockerfile: Dockerfile
    image: "flycloud-bpm:${IMAGE_TAG:-latest}"
    container_name: flycloud-bpm
    ports:
      - "8090:8090"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-bpm/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_BPM_JAVA_OPTS:-}"

  flycloud-mall:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-mall"
      dockerfile: Dockerfile
    image: "flycloud-mall:${IMAGE_TAG:-latest}"
    container_name: flycloud-mall
    ports:
      - "8081:8081"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-mall/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_MALL_JAVA_OPTS:-}"

  flycloud-ai:
    <<: *service-defaults
    build:
      context: "${PROJECT_DIR:-/project/flycloud-service}/flycloud-ai"
      dockerfile: Dockerfile
    image: "flycloud-ai:${IMAGE_TAG:-latest}"
    container_name: flycloud-ai
    ports:
      - "8086:8086"
    volumes:
      - "${PROJECT_DIR:-/project/flycloud-service}/flycloud-ai/logs:/flycloud/logs"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      JAVA_OPTS: "${FLYCLOUD_AI_JAVA_OPTS:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"

networks:
  default:
    name: "${COMPOSE_NETWORK_NAME:-flycloud-server}"
    driver: bridge
